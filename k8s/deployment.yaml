apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlinehub-web
  namespace: headlinehub
  labels:
    app: headlinehub-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: headlinehub-web
  template:
    metadata:
      labels:
        app: headlinehub-web
    spec:
      containers:
      - name: web
        image: headlinehub/web:latest
        ports:
        - containerPort: 4321
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: headlinehub-web-svc
  namespace: headlinehub
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4321
  selector:
    app: headlinehub-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlinehub-api
  namespace: headlinehub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: headlinehub-api
  template:
    metadata:
      labels:
        app: headlinehub-api
    spec:
      containers:
      - name: api
        image: headlinehub/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: headlinehub-secrets
              key: database-url

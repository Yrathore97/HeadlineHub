apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlinehub-ingress
  namespace: headlinehub
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - headlinehub.ai
    - api.headlinehub.ai
    secretName: headlinehub-tls
  rules:
  - host: headlinehub.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlinehub-web-svc
            port:
              number: 80
  - host: api.headlinehub.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlinehub-api-svc
            port:
              number: 8000

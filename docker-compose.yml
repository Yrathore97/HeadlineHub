version: '3.8'

services:
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
    depends_on:
      - fastapi-backend

  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/headlinehub
      - REDIS_URL=redis://redis-cache:6379/0
    depends_on:
      - postgres-db
      - redis-cache

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: headlinehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

name: NewzWale CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # astro build spins up a Cloudflare preview server to prerender static
      # pages, which eagerly opens a remote proxy session for any binding
      # marked remote: true (the WEBSEARCH binding has no local emulation).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Astro Code Check & Type Check
      run: npx astro check

    - name: Build Web Application
      run: npm run build

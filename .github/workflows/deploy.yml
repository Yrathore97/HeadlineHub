name: NewzWale CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Astro Code Check & Type Check
      run: npx astro check

    - name: Build Web Application
      run: npm run build
